name: Standalone Swift Toolchain Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-smoke-test:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Verify Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version

      - name: Create isolated Swift package test fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/SwiftSmoke/Sources/SmokeLib" "$RUNNER_TEMP/SwiftSmoke/Tests/SmokeLibTests"
          cat > "$RUNNER_TEMP/SwiftSmoke/Package.swift" <<'PACKAGE'
          // swift-tools-version: 6.0
          import PackageDescription
          let package = Package(
              name: "SwiftSmoke",
              products: [.library(name: "SmokeLib", targets: ["SmokeLib"])],
              targets: [
                  .target(name: "SmokeLib"),
                  .testTarget(name: "SmokeLibTests", dependencies: ["SmokeLib"])
              ]
          )
          PACKAGE
          cat > "$RUNNER_TEMP/SwiftSmoke/Sources/SmokeLib/Smoke.swift" <<'SWIFT'
          public enum Smoke {
              public static func add(_ a: Int, _ b: Int) -> Int { a + b }
              public static func clamp(_ value: Int, min lower: Int, max upper: Int) -> Int {
                  Swift.max(lower, Swift.min(value, upper))
              }
          }
          SWIFT
          cat > "$RUNNER_TEMP/SwiftSmoke/Tests/SmokeLibTests/SmokeTests.swift" <<'SWIFT'
          import XCTest
          import SmokeLib
          final class SmokeTests: XCTestCase {
              func testAddition() { XCTAssertEqual(Smoke.add(2, 3), 5) }
              func testClampInsideRange() { XCTAssertEqual(Smoke.clamp(4, min: 0, max: 10), 4) }
              func testClampLowerBound() { XCTAssertEqual(Smoke.clamp(-4, min: 0, max: 10), 0) }
              func testClampUpperBound() { XCTAssertEqual(Smoke.clamp(14, min: 0, max: 10), 10) }
          }
          SWIFT

      - name: Run isolated Swift package tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/SwiftSmoke"
          swift test --parallel
